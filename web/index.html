<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Predicción de reingreso hospitalario a 30 días en pacientes con diabetes. Universidad Popular del Cesar, Grupo 04."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=Inter:wght@400;500;600&family=Nunito+Sans:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>ReingresaIA — Riesgo de reingreso a 30 días</title>
    <script>
      // El tema se aplica ANTES de que React monte. Si se deja para el primer
      // efecto, la pagina se pinta clara y medio segundo despues salta a
      // oscura: un parpadeo feo que ademas marea. Tiene que ir en linea y sin
      // modulo para que corra antes del primer pintado.
      ;(function () {
        try {
          var guardado = localStorage.getItem('reingresaia-tema')
          var tema =
            guardado === 'claro' || guardado === 'oscuro'
              ? guardado
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'oscuro'
                : 'claro'
          document.documentElement.setAttribute('data-tema', tema)
        } catch (e) {
          document.documentElement.setAttribute('data-tema', 'claro')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
