name: Validar ReingresaIA experimental

on:
  push:
    branches:
      - experiment/reingresaia-ui
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interfaz:
    name: Compilar y revisar React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  historial:
    name: Validar permisos e historial
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-api.txt
      - run: python -m pip install -r requirements-api.txt
      - run: python -m unittest discover -s tests -p 'test_roles_y_contactos.py' -v
